services:
  app:
    build:
      context: .
      target: app
    restart: always
    ports:
      # Только localhost: наружу сайт отдаёт nginx (80/443) на самом VPS.
      # Если nginx на хосте не используется — замените на "3001:3001".
      - "127.0.0.1:3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-foodorderhub}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@db:5432/${POSTGRES_DB:-foodorderhub}?schema=public
      - JWT_SECRET=${JWT_SECRET:?Задайте JWT_SECRET в .env}
      - PORT=3001
      - HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy

  # Админ-панель — отдельный контейнер (nginx) на порту 3002.
  # API-запросы проксируются на app, БД напрямую не трогается.
  admin:
    build:
      context: .
      target: admin
    restart: always
    ports:
      # Только localhost (см. комментарий у сервиса app).
      - "127.0.0.1:3002:80"
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    restart: always
    # Тюнинг под VPS с ~1 ГБ RAM (дефолты Postgres рассчитаны на серверы с 4+ ГБ)
    command: >
      postgres
      -c shared_buffers=192MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c work_mem=4MB
      -c max_connections=80
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-foodorderhub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      - POSTGRES_DB=${POSTGRES_DB:-foodorderhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # БД наружу не публикуем — app ходит через внутреннюю сеть compose.
    # Для отладки с локальной машины раскомментируй:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodorderhub} -d ${POSTGRES_DB:-foodorderhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
