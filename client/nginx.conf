# nginx-конфиг админ-панели FoodOrderHub (контейнер admin, порт 80 → наружу 3002)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Админка закрыта от поисковиков: свой robots.txt (перекрывает скопированный из public/)
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Запрет индексации на уровне заголовков (Google/Yandex понимают)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # API проксируется в основной контейнер app (Node/Express :3001)
    location /api/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: все прочие пути отдают index.html
    location / {
        try_files $uri /index.html;
    }

    # Кэширование хэшированных ассетов
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
