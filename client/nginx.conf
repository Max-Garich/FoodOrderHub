# Конфиг nginx для контейнера админ-панели (порт 3002 снаружи)
# Статика dist-admin + прокси API на основной сервер (сервис app в compose-сети)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API проксируется на backend-контейнер
    location /api/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: все прочие пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
