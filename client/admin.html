<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FoodOrderHub — Админ-панель</title>
    <script>
      // Apply theme before React renders to prevent flash.
      // Приоритет: ручной выбор пользователя (themeChoice) → системная тема.
      (function() {
        var theme = localStorage.getItem('themeChoice');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-admin.jsx"></script>
  </body>
</html>
